apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: industrial-maintenance
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Gostp098/industrial_maintenance
    targetRevision: main
    path: K8s
  destination:
    server: https://kubernetes.default.svc
    namespace: industrial-maintenance
  syncPolicy:
    automated:
      prune: true
      selfHeal: true