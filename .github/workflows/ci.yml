name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  IMAGE_BACKEND: ${{ secrets.DOCKER_USERNAME }}/industrial-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/industrial-frontend

jobs:
  # ── STAGE 1: LINT ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  # ── STAGE 2: TEST ────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mariem
          POSTGRES_DB: industrial_maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run backend tests with coverage
        working-directory: backend
        run: npm test -- --coverage
        env:
          DB_USER: postgres
          DB_PASSWORD: mariem
          DB_NAME: industrial_maintenance
          DB_HOST: localhost
          DB_PORT: 5432
          PORT: 5000

  # ── STAGE 3: BUILD ───────────────────────────────────────────────────────
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── STAGE 4: SONARQUBE ───────────────────────────────────────────────────
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── STAGE 5: SECURITY SCAN ───────────────────────────────────────────────
  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image for scanning
        run: |
          docker build -f docker/backend/Dockerfile -t backend-scan:latest .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "backend-scan:latest"
          format: "table"
          exit-code: "1"        # ← pipeline FAILS on CRITICAL CVEs
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Build frontend image for scanning
        run: |
          docker build -f docker/frontend/Dockerfile -t frontend-scan:latest .

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "frontend-scan:latest"
          format: "table"
          exit-code: "1"        # ← pipeline FAILS on CRITICAL CVEs
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

  # ── STAGE 6: DOCKER PUSH + UPDATE K8s ───────────────────────────────────
  docker:
    name: Push Images & Update K8s
    runs-on: ubuntu-latest
    needs: [security, sonar]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag from commit SHA
        id: tag
        run: echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ steps.tag.outputs.TAG }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ steps.tag.outputs.TAG }}

      - name: Update K8s manifests with new image tag
        run: |
          sed -i "s|image: .*/industrial-backend:.*|image: ${{ env.IMAGE_BACKEND }}:${{ steps.tag.outputs.TAG }}|" K8s/backend.yaml
          sed -i "s|image: .*/industrial-frontend:.*|image: ${{ env.IMAGE_FRONTEND }}:${{ steps.tag.outputs.TAG }}|" K8s/frontend.yaml

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add K8s/backend.yaml K8s/frontend.yaml
          git commit -m "ci: update image tags to ${{ steps.tag.outputs.TAG }}" || echo "No changes"
          git push