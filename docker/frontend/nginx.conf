server {
    listen 80;
    server_name localhost;

    # Serve React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Critical for React Router — always return index.html for unknown paths
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the backend container
    # "backend" is the service name in docker-compose — Docker resolves it automatically
    location /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy /health and /metrics for monitoring
    location /metrics {
        proxy_pass http://backend:5000;
    }

    location /health {
        proxy_pass http://backend:5000;
    }
}